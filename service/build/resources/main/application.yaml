server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: user-service-admin
              uri: http://localhost:8081
              predicates:
                - Path=/api/admin/**

            - id: catalog-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/catalog/**

            - id: deal-payment-service-deals
              uri: http://localhost:8083
              predicates:
                - Path=/api/deals/**

            - id: deal-payment-service-reviews
              uri: http://localhost:8083
              predicates:
                - Path=/api/reviews/**

            - id: deal-payment-service-complaints
              uri: http://localhost:8083
              predicates:
                - Path=/api/complaints/**

            - id: deal-payment-service-webhooks
              uri: http://localhost:8083
              predicates:
                - Path=/api/webhooks/**

            - id: comm-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/messages/**

            - id: comm-service-chats
              uri: http://localhost:8084
              predicates:
                - Path=/api/chats/**

            - id: comm-service-internal
              uri: http://localhost:8084
              predicates:
                - Path=/api/internal/chats/**

            - id: audit-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/audit/**

            - id: audit-service-internal
              uri: http://localhost:8085
              predicates:
                - Path=/api/internal/audit**


  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem

management:
  endpoints:
    web:
      exposure:
        include: health,info